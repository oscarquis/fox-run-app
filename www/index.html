<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Runner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="juego">

    <canvas id="game" width="900" height="300"></canvas>

    <div id="controles">
        <button id="btnJump">⬆ SALTAR luciana</button>
        <button id="btnDuck">⬇ AGACHAR</button>
    </div>
<button id="btnVictory" style="
    display:none;
    position:absolute;
    left:50%;
    top:170px;
    transform:translateX(-50%);
    padding:12px 25px;
    font-size:20px;
    font-weight:bold;
    border:none;
    border-radius:10px;
">
    REINICIAR
</button>
</div>

<script src="game.js"></script>
</body>
</html>
